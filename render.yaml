services:
  - type: web
    name: rehabita-demo-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: rehabita-demo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/rehabita.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
